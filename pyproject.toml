[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "bts-algo"
version = "0.1.0"
description = "Algorithmic Trading Portfolio with Hybrid Deep Learning and Graph Visibility"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["algorithmic-trading", "deep-learning", "quantitative-finance", "monte-carlo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "tensorflow>=2.16.0",
    "numpy>=1.21.0",
    "pandas>=1.5.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "plotly>=5.0.0",
    "scipy>=1.9.0",
    "scikit-learn>=1.1.0",
    "optuna>=3.0.0",
    "keras-tuner>=1.3.0",
    "networkx>=2.8.0",
    "graphviz>=0.20.0",
    "pydot>=1.4.0",
    "PyYAML>=6.0",
    "python-dotenv>=0.19.0",
    "click>=8.0.0",
    "tqdm>=4.64.0",
    "joblib>=1.2.0",
    "numba>=0.56.0",
    "ta-lib>=0.4.0",
    "yfinance>=0.2.0",
    "alpaca-trade-api>=3.0.0",
    "ib-insync>=0.9.70",
    "kafka-python>=2.0.0",
    "pyarrow>=10.0.0",
    "fastparquet>=0.8.0",
    "sqlalchemy>=1.4.0",
    "tensorboard>=2.13.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
gpu = [
    "tensorflow[and-cuda]>=2.16.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "flake8>=5.0.0",
    "mypy>=0.991",
    "pre-commit>=2.20.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.15.0",
]
docs = [
    "sphinx>=5.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "myst-parser>=0.18.0",
]

[project.scripts]
bts-train = "python.train:main"
bts-backtest = "python.backtest:main"
bts-hyperopt = "python.hyperopt:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["python*"]

[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=python",
    "--cov-report=html",
    "--cov-report=term-missing",
] 